name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shared:
    # Apple-silicon macOS: builds the shared Kotlin code for iOS and tests it on the simulator.
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # to publish the test log on the ci-ios-shared branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts') }}

      - name: Test map
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: testdata
          key: testmap-${{ steps.month.outputs.month }}
      - run: |
          mkdir -p testdata
          [ -f testdata/liechtenstein.map ] || curl -fsSL -A "MapAround-CI (github.com/adam2314/maparound)" \
            -o testdata/liechtenstein.map https://download.mapsforge.org/maps/v5/europe/liechtenstein.map

      - name: Shared code on the iOS simulator
        env:
          # Environment variables reach the simulator process with this prefix.
          SIMCTL_CHILD_MAP_FILE: ${{ github.workspace }}/testdata/liechtenstein.map
          SIMCTL_CHILD_THEME_FILE: ${{ github.workspace }}/app/src/main/assets/themes/topo.xml
        run: |
          set -o pipefail
          ./gradlew :shared:iosSimulatorArm64Test --console=plain 2>&1 | tee shared-log.txt

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shared-test-results
          path: shared/build/test-results/
          if-no-files-found: ignore

      # Compiler errors and failed tests, readable without signing in:
      # https://raw.githubusercontent.com/<owner>/<repo>/ci-ios-shared/shared-log.txt
      - name: Publish the test log (branch ci-ios-shared)
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out
          if [ -f shared-log.txt ]; then
            { grep -nE "^e: |^w: .*(error|unresolved)|FAILED|BUILD|What went wrong" shared-log.txt | head -300; echo ----; tail -150 shared-log.txt; } > /tmp/out/shared-log.txt
          fi
          python3 - > /tmp/out/failures.txt <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          for x in sorted(glob.glob("shared/build/test-results/iosSimulatorArm64Test/*.xml")):
              r = ET.parse(x).getroot()
              total += int(r.get("tests", 0))
              for tc in r.iter("testcase"):
                  for f in tc.findall("failure") + tc.findall("error"):
                      failed += 1
                      print(f"{tc.get('classname')}.{tc.get('name')}: {(f.get('message') or '')[:500]}")
                      print((f.text or "")[:1500])
                      print("----")
          print(f"{total} tests, {failed} failed")
          PY
          echo "${GITHUB_SHA}" > /tmp/out/commit.txt
          cd /tmp/out
          git init -q -b ci-ios-shared
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS shared test log for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-ios-shared

  app:
    # Builds the iOS app, runs it in the simulator and keeps a screenshot.
    needs: shared
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write # to publish the latest screenshot on the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts') }}

      - name: Test map
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: testdata
          key: testmap-${{ steps.month.outputs.month }}
      - run: |
          mkdir -p testdata
          [ -f testdata/liechtenstein.map ] || curl -fsSL -A "MapAround-CI (github.com/adam2314/maparound)" \
            -o testdata/liechtenstein.map https://download.mapsforge.org/maps/v5/europe/liechtenstein.map
          # Elevation around Liechtenstein (the 1° tile, same source as the app).
          [ -f testdata/N47E009.hgt ] || curl -fsSL https://elevation-tiles-prod.s3.amazonaws.com/skadi/N47/N47E009.hgt.gz | gunzip > testdata/N47E009.hgt

      - uses: actions/cache@v4
        with:
          path: fontcache
          key: openmaptiles-fonts-v2.0
      - name: Label fonts and map symbols
        run: |
          iosApp/fetch-fonts.sh "$PWD/fontcache"
          iosApp/fetch-symbols.sh "$PWD/fontcache"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project MapAround.xcodeproj -scheme MapAround -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build-log.txt | tail -60
          # The app icon made it into the app (actool names it in Info.plist).
          plutil -p build/Build/Products/Debug-iphonesimulator/MapAround.app/Info.plist | grep -A4 CFBundleIcons | grep -q AppIcon

      - name: Run in the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" iosApp/build/Build/Products/Debug-iphonesimulator/MapAround.app
          # The test map and its terrain in the app's Documents folder, as if downloaded.
          DATA=$(xcrun simctl get_app_container "$UDID" app.maparound data)
          mkdir -p "$DATA/Documents/maps" "$DATA/Documents/dem"
          cp testdata/liechtenstein.map "$DATA/Documents/maps/europe__liechtenstein.map"
          cp testdata/N47E009.hgt "$DATA/Documents/dem/"
          # Location allowed, and the simulator in Vaduz.
          xcrun simctl privacy "$UDID" grant location app.maparound || true
          xcrun simctl location "$UDID" set 47.1410,9.5215 || true
          # MAPAROUND_DEMO starts over Vaduz; MAPAROUND_TAB opens another tab.
          shot() {
            xcrun simctl terminate "$UDID" app.maparound 2>/dev/null || true
            SIMCTL_CHILD_MAPAROUND_DEMO=1 SIMCTL_CHILD_MAPAROUND_TAB="$2" xcrun simctl launch "$UDID" app.maparound
            sleep "$3"
            xcrun simctl io "$UDID" screenshot "$1"
          }
          shot screenshot.png Map 40
          shot screenshot-offline.png Offline 15
          shot screenshot-library.png Routes 15
          shot screenshot-sensors.png Sensors 15
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "MapAround"' > app-log.txt || true
          tail -40 app-log.txt || true

      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: |
            screenshot.png
            screenshot-offline.png
            screenshot-library.png
            screenshot-sensors.png
            app-log.txt
          if-no-files-found: ignore

      # The latest screenshot, readable without signing in:
      # https://raw.githubusercontent.com/<owner>/<repo>/ci-screenshots/screenshot.png
      - name: Publish the screenshot (branch ci-screenshots)
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/shots
          [ -f screenshot.png ] && cp screenshot.png /tmp/shots/
          [ -f screenshot-offline.png ] && cp screenshot-offline.png /tmp/shots/
          [ -f screenshot-library.png ] && cp screenshot-library.png /tmp/shots/
          [ -f screenshot-sensors.png ] && cp screenshot-sensors.png /tmp/shots/
          [ -f app-log.txt ] && cp app-log.txt /tmp/shots/
          # The build log's errors and last lines, to see why a build failed.
          if [ -f build-log.txt ]; then
            { grep -nE "error:|fatal|BUILD FAILED" build-log.txt | head -200; echo ----; tail -300 build-log.txt; } > /tmp/shots/build-log.txt
          fi
          echo "${GITHUB_SHA}" > /tmp/shots/commit.txt
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Simulator screenshot for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shared:
    # Apple-silicon macOS: builds the shared Kotlin code for iOS and tests it on the simulator.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts') }}

      - name: Test map
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: testdata
          key: testmap-${{ steps.month.outputs.month }}
      - run: |
          mkdir -p testdata
          [ -f testdata/liechtenstein.map ] || curl -fsSL -A "MapAround-CI (github.com/adam2314/maparound)" \
            -o testdata/liechtenstein.map https://download.mapsforge.org/maps/v5/europe/liechtenstein.map

      - name: Shared code on the iOS simulator
        env:
          # Environment variables reach the simulator process with this prefix.
          SIMCTL_CHILD_MAP_FILE: ${{ github.workspace }}/testdata/liechtenstein.map
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shared-test-results
          path: shared/build/test-results/
          if-no-files-found: ignore

  app:
    # Builds the iOS app, runs it in the simulator and keeps a screenshot.
    needs: shared
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write # to publish the latest screenshot on the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts') }}

      - name: Test map
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: testdata
          key: testmap-${{ steps.month.outputs.month }}
      - run: |
          mkdir -p testdata
          [ -f testdata/liechtenstein.map ] || curl -fsSL -A "MapAround-CI (github.com/adam2314/maparound)" \
            -o testdata/liechtenstein.map https://download.mapsforge.org/maps/v5/europe/liechtenstein.map
          cp testdata/liechtenstein.map iosApp/MapAround/liechtenstein.map

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project MapAround.xcodeproj -scheme MapAround -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build-log.txt | tail -60

      - name: Run in the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" iosApp/build/Build/Products/Debug-iphonesimulator/MapAround.app
          xcrun simctl launch "$UDID" app.maparound
          sleep 30
          xcrun simctl io "$UDID" screenshot screenshot.png
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "MapAround"' > app-log.txt || true
          tail -40 app-log.txt || true

      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: |
            screenshot.png
            app-log.txt
          if-no-files-found: ignore

      # The latest screenshot, readable without signing in:
      # https://raw.githubusercontent.com/<owner>/<repo>/ci-screenshots/screenshot.png
      - name: Publish the screenshot (branch ci-screenshots)
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/shots
          [ -f screenshot.png ] && cp screenshot.png /tmp/shots/
          [ -f app-log.txt ] && cp app-log.txt /tmp/shots/
          # The build log's errors and last lines, to see why a build failed.
          if [ -f build-log.txt ]; then
            { grep -nE "error:|fatal|BUILD FAILED" build-log.txt | head -200; echo ----; tail -300 build-log.txt; } > /tmp/shots/build-log.txt
          fi
          echo "${GITHUB_SHA}" > /tmp/shots/commit.txt
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Simulator screenshot for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

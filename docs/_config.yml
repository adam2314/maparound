# GitHub Pages site for MapAround, built with the web app under app/ by .github/workflows/pages.yml
# (Settings → Pages → Source: GitHub Actions).
# index.html is the home page; Markdown pages such as privacy.md use _layouts/default.html.
title: MapAround
description: Offline topo maps, routes and navigation, trails, and off-grid group tracking.
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - IOS_PLAN.md
  - "store/*.mp4"

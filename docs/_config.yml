# GitHub Pages site for MapAround, built with the web app under app/ by .github/workflows/pages.yml
# (Settings → Pages → Source: GitHub Actions).
# index.html is the home page; Markdown pages such as privacy.md use _layouts/default.html.
title: MapAround
# The site's own address: pages link from its root (GitHub Pages' project address,
# adam2314.github.io/maparound, redirects here).
url: "https://maparound.app"
baseurl: ""
description: Offline topo maps, routes and navigation, trails, and off-grid group tracking.
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - IOS_PLAN.md
  - "store/*.mp4"
# The Android beta's testers group on Google Groups (beta.md, he/beta.md): joining it, then opting in
# on Google Play, is how testers get the closed test.
beta_group: "https://groups.google.com/g/maparound"

# GitHub Pages site for MapAround (Settings → Pages → Deploy from a branch: main, /docs).
# index.html is the home page; Markdown pages such as privacy.md use _layouts/default.html.
title: MapAround
description: Offline topo maps, routes and navigation, trails, and off-grid group tracking.
defaults:

# XcodeGen spec: `xcodegen generate` makes MapAround.xcodeproj (not checked in).
name: MapAround
options:
  bundleIdPrefix: app.maparound
  deploymentTarget:
    iOS: "16.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"
targets:
  MapAround:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: MapAround
      # The Android map's theme: the iOS map style is made from it (ThemeStyle.kt).
      - path: ../app/src/main/assets/themes/topo.xml
        buildPhase: resources
      # Label fonts (run fetch-fonts.sh first), kept as a folder: Fonts/<font>/<range>.pbf
      - path: Fonts
        type: folder
        buildPhase: resources
      # The theme's symbols as PNGs (run fetch-symbols.sh first): Symbols/symbols_peak.png
      - path: Symbols
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
    info:
      path: MapAround/Info.plist
      properties:
        CFBundleDisplayName: MapAround
        CFBundleShortVersionString: "0.1.0"
        NSLocationWhenInUseUsageDescription: "MapAround shows where you are on the map and measures your speed and altitude."
        NSMotionUsageDescription: "MapAround shows the air pressure and motion sensors on the Sensors tab."
        UILaunchScreen: {}
        # The app's Documents (maps, tracks, places) in the Files app; files from Files open in place.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # maparound:// links (shared routes and places, party invites later).
        CFBundleURLTypes:
          - CFBundleURLName: app.maparound
            CFBundleURLSchemes: [maparound]
        # GPX files and mapsforge maps open with MapAround.
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
          - CFBundleTypeName: Mapsforge map
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.mapsforge.map]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX file
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
          - UTTypeIdentifier: org.mapsforge.map
            UTTypeDescription: Mapsforge map
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [map]
        # Compose Multiplatform draws at the display's full refresh rate (and checks for this key).
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # MapLibre reads our vector tiles from a server inside the app (127.0.0.1).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.maparound
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The shared Kotlin framework is built for Apple-silicon simulators only (no Intel slice).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # The shared Kotlin code, built by Gradle for the current platform and configuration.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework MapAroundShared"
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain
